<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-label="Datapath do Mini-8: ROM, controle, registradores, ULA, RAM e PC">
<defs>
<style><![CDATA[
.bg{fill:#0b1020}.panel{fill:#151f33;stroke:#405477;stroke-width:2}.big{font:700 29px system-ui,sans-serif;fill:#f7fbff}.small{font:16px system-ui,sans-serif;fill:#b6c6df}.title{font:700 45px system-ui,sans-serif;fill:#fff}.line{fill:none;stroke:#55c8f3;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.data{fill:none;stroke:#ffbd69;stroke-width:5;stroke-linecap:round}.ctrl{fill:none;stroke:#c89aff;stroke-width:4;stroke-dasharray:10 9;stroke-linecap:round}]]></style>
<marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#55c8f3"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#ffbd69"/></marker>
<marker id="c" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#c89aff"/></marker></defs>
<rect width="1240" height="620" rx="22" class="bg"/><text x="45" y="75" class="title">Mini-8  |  Caminho de Dados</text><text x="46" y="106" class="small">CPU uniciclo • instruções e dados de 8 bits • diagrama didático</text>
<rect x="46" y="178" width="145" height="85" rx="12" class="panel"/><text x="118" y="216" text-anchor="middle" class="big">PC</text><text x="118" y="242" text-anchor="middle" class="small">8 bits</text>
<rect x="257" y="160" width="195" height="121" rx="12" class="panel"/><text x="354" y="205" text-anchor="middle" class="big">ROM</text><text x="354" y="232" text-anchor="middle" class="small">Instruções</text><text x="354" y="254" text-anchor="middle" class="small">256 × 8</text>
<rect x="540" y="140" width="198" height="100" rx="12" class="panel"/><text x="639" y="181" text-anchor="middle" class="big">Controle</text><text x="639" y="208" text-anchor="middle" class="small">Opcode [7:6]</text>
<rect x="514" y="320" width="220" height="130" rx="12" class="panel"/><text x="624" y="365" text-anchor="middle" class="big">Registradores</text><text x="624" y="396" text-anchor="middle" class="small">R0 – R7 (R0 = zero)</text><text x="624" y="420" text-anchor="middle" class="small">A[5:3] / B[2:0]</text>
<rect x="830" y="335" width="150" height="103" rx="12" class="panel"/><text x="905" y="380" text-anchor="middle" class="big">ULA</text><text x="905" y="408" text-anchor="middle" class="small">Soma / Zero</text>
<rect x="1064" y="320" width="150" height="130" rx="12" class="panel"/><text x="1139" y="366" text-anchor="middle" class="big">RAM</text><text x="1139" y="397" text-anchor="middle" class="small">256 × 8</text><text x="1139" y="421" text-anchor="middle" class="small">LD / ST</text>
<path d="M191 220 H249" class="line" marker-end="url(#a)"/><path d="M452 190 H532" class="ctrl" marker-end="url(#c)"/><path d="M354 281 V385 H506" class="line" marker-end="url(#a)"/><path d="M738 190 H905 V326" class="ctrl" marker-end="url(#c)"/><path d="M734 385 H821" class="data" marker-end="url(#b)"/><path d="M981 385 H1055" class="data" marker-end="url(#b)"/>
<path d="M1139 450 V515 H623 V460" class="line" marker-end="url(#a)"/><path d="M905 438 V485 H710 V460" class="data" marker-end="url(#b)"/>
<path d="M640 450 V560 H118 V273" class="ctrl" marker-end="url(#c)"/>
<text x="750" y="375" class="small">Operandos</text><text x="978" y="366" class="small">Endereço</text><text x="850" y="507" class="small">Resultado ADD</text><text x="820" y="544" class="small">Dado lido</text><text x="199" y="580" class="small">Controle de desvio: DvC ∧ Zero → seleção do próximo PC</text>
